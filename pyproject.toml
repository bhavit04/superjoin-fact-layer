[project]
name = "factlayer"
version = "0.1.0"
description = "A cross-document fact knowledge layer: extract grounded facts from PDFs, then corroborate, contradict, or reconcile them."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymupdf>=1.24",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
factlayer = "factlayer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factlayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
